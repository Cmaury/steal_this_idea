<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>User &mdash; gutter.news</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="dateline-row">
      <span class="dateline-left">Vol. I &middot; No. 1</span>
      <span class="dateline-center">The Hacker News for News Hackers</span>
      <span class="dateline-right" id="today"></span>
    </div>
    <h1 class="title"><a href="/"><em>gutter</em>.news</a></h1>
    <div class="motto">&mdash; All the news that&rsquo;s fit to ship. &mdash;</div>
    <nav class="topnav">
      <a href="/" class="nav-sort" data-sort="top">top</a>
      <span class="sep">|</span>
      <a href="/?sort=new" class="nav-sort" data-sort="new">new</a>
      <span class="sep">|</span>
      <a href="/?sort=ask" class="nav-sort" data-sort="ask">ask</a>
      <span class="sep">|</span>
      <a href="/?sort=show" class="nav-sort" data-sort="show">show</a>
      <span class="sep">|</span>
      <a href="/submit.html">submit</a>
      <span class="spacer"></span>
      <a href="/login.html" class="login auth-nav">login</a>
    </nav>
  </header>

  <main class="stories">
    <div id="profile"></div>
    <div id="submissions"></div>
    <div id="comments"></div>
  </main>

  <footer>
    <hr>
    <nav class="footnav"><a href="/">Front page</a></nav>
    <p class="colophon">Set in Playfair Display &amp; Source Serif. Hand-set in the gutter.</p>
  </footer>

  <script>
    function $(s) { return document.querySelector(s); }
    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function domainOf(url) {
      try { return new URL(url).host; }
      catch { return String(url).replace(/^https?:\/\//, "").split("/")[0]; }
    }

    $("#today").textContent = new Date().toLocaleDateString("en-US", {
      weekday: "long", year: "numeric", month: "long", day: "numeric",
    });

    const username = new URLSearchParams(location.search).get("id");

    (async () => {
      try {
        const res = await fetch("/api/me", { credentials: "same-origin" });
        const data = await res.json();
        if (data.user) {
          const el = $(".auth-nav");
          const u = escapeHtml(data.user.username);
          el.outerHTML =
            `<a href="/user.html?id=${encodeURIComponent(data.user.username)}" class="user auth-nav">${u}</a>` +
            ` <span class="sep">|</span> ` +
            `<a href="/settings.html" class="auth-nav">settings</a>` +
            ` <span class="sep">|</span> ` +
            `<a href="#" class="logout auth-nav">logout</a>`;
          $(".logout").addEventListener("click", async (e) => {
            e.preventDefault();
            await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
            location.reload();
          });
        }
      } catch (e) { /* ignore */ }
    })();

    (async () => {
      if (!username) {
        $("#profile").innerHTML = `<p><em>No user specified.</em></p>`;
        return;
      }
      try {
        const res = await fetch(`/api/users/${encodeURIComponent(username)}`, { credentials: "same-origin" });
        const data = await res.json();
        if (!res.ok) {
          $("#profile").innerHTML = `<p><em>${escapeHtml(data.error || "User not found.")}</em></p>`;
          return;
        }
        renderProfile(data.profile);
      } catch (e) {
        $("#profile").innerHTML = `<p><em>Failed to load user.</em></p>`;
      }
    })();

    function renderProfile(p) {
      $("#profile").innerHTML = `
        <div class="profile-card">
          <h2 class="profile-name">${escapeHtml(p.username)}</h2>
          <p class="profile-meta">
            joined ${escapeHtml(p.created)} &middot;
            <strong>${p.karma}</strong> karma &middot;
            ${p.submissions.length} submission${p.submissions.length === 1 ? "" : "s"} &middot;
            ${p.comments.length} comment${p.comments.length === 1 ? "" : "s"}
          </p>
        </div>
      `;

      if (p.submissions.length) {
        $("#submissions").innerHTML = `
          <h3 class="section-head">Submissions</h3>
          <ol class="story-list">
            ${p.submissions.map((s, i) => {
              const url = s.url || `/comments.html?id=${s.id}`;
              const domain = s.url ? domainOf(s.url) : "";
              return `
                <li class="story">
                  <span class="rank">${i + 1}.</span>
                  <span class="upvote-placeholder"></span>
                  <div class="story-body">
                    <span class="story-title">
                      <a href="${escapeHtml(url)}">${escapeHtml(s.title)}</a>
                      ${domain ? `<span class="domain">(${escapeHtml(domain)})</span>` : ""}
                    </span>
                    <div class="meta">
                      <span class="points">${s.points}</span> point${s.points === 1 ? "" : "s"} &middot;
                      <a href="/comments.html?id=${s.id}">${s.comments} comment${s.comments === 1 ? "" : "s"}</a> &middot;
                      ${escapeHtml(s.age)}
                    </div>
                  </div>
                </li>`;
            }).join("")}
          </ol>
        `;
      } else {
        $("#submissions").innerHTML = `<h3 class="section-head">Submissions</h3><p><em>No submissions yet.</em></p>`;
      }

      if (p.comments.length) {
        $("#comments").innerHTML = `
          <h3 class="section-head">Comments</h3>
          <ul class="comment-list">
            ${p.comments.map(c => `
              <li class="comment">
                <div class="cmeta">
                  on <a href="/comments.html?id=${c.story_id}">${escapeHtml(c.story_title)}</a>
                  &middot; ${escapeHtml(c.age)}
                </div>
                <div class="cbody">${escapeHtml(c.text).split("\n\n").map(p2 => "<p>" + p2.replace(/\n/g, "<br>") + "</p>").join("")}</div>
              </li>
            `).join("")}
          </ul>
        `;
      } else {
        $("#comments").innerHTML = `<h3 class="section-head">Comments</h3><p><em>No comments yet.</em></p>`;
      }
    }
  </script>
</body>
</html>

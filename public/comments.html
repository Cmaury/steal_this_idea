<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Comments &mdash; gutter.news</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="masthead">
    <div class="dateline-row">
      <span class="dateline-left">Vol. I &middot; No. 1</span>
      <span class="dateline-right" id="today"></span>
    </div>
    <h1 class="title"><a href="/"><em>gutter</em>.news</a></h1>
    <div class="motto">The Hacker News for News Hackers</div>
    <nav class="topnav">
      <a href="/" class="nav-sort" data-sort="top">top</a>
      <span class="sep">|</span>
      <a href="/?sort=new" class="nav-sort" data-sort="new">new</a>
      <span class="sep">|</span>
      <a href="/?sort=ask" class="nav-sort" data-sort="ask">ask</a>
      <span class="sep">|</span>
      <a href="/?sort=show" class="nav-sort" data-sort="show">show</a>
      <span class="sep">|</span>
      <a href="#" class="active">comments</a>
      <span class="sep">|</span>
      <a href="/submit.html">submit</a>
      <span class="spacer"></span>
      <a href="/login.html" class="login auth-nav">login</a>
    </nav>
  </header>

  <main class="stories">
    <div id="story-header" class="story-header"></div>

    <form class="compose" id="compose-form" style="display:none;">
      <textarea id="compose-text" placeholder="Be kind. Be brief. Cite your sources." maxlength="5000"></textarea>
      <div><button type="submit">add comment</button></div>
      <p class="error-msg" id="compose-error"></p>
    </form>
    <p class="compose-prompt" id="compose-prompt" style="display:none;">
      <em><a href="/login.html">Log in</a> to leave a comment.</em>
    </p>

    <ul class="comment-list" id="comment-list"></ul>
  </main>

  <footer>
    <hr>
    <nav class="footnav">
      <a href="/">Front page</a> &middot;
      <a href="/submit.html">Submit</a> &middot;
      <a href="#">Guidelines</a>
    </nav>
    <p class="colophon">Set in Playfair Display &amp; Source Serif. Hand-set in the gutter.</p>
  </footer>

  <script>
    function $(s, root) { return (root || document).querySelector(s); }
    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function domainOf(url) {
      try { return new URL(url).host; }
      catch { return String(url).replace(/^https?:\/\//, "").split("/")[0]; }
    }
    function renderTextBody(text) {
      return escapeHtml(text)
        .split("\n\n")
        .map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>")
        .join("");
    }

    let currentUser = null;
    let currentStory = null;
    const storyId = parseInt(new URLSearchParams(location.search).get("id"));

    async function init() {
      $("#today").textContent = new Date().toLocaleDateString("en-US", {
        weekday: "long", year: "numeric", month: "long", day: "numeric",
      });
      await loadMe();
      await Promise.all([loadStory(), loadComments()]);
    }

    async function loadMe() {
      try {
        const res = await fetch("/api/me", { credentials: "same-origin" });
        const data = await res.json();
        currentUser = data.user;
        renderAuth();
        renderCompose();
      } catch (e) { /* ignore */ }
    }

    function renderAuth() {
      const el = $(".auth-nav");
      if (!el || !currentUser) return;
      const u = escapeHtml(currentUser.username);
      el.outerHTML =
        `<a href="/user.html?id=${encodeURIComponent(currentUser.username)}" class="user auth-nav">${u}</a>` +
        ` <span class="sep">|</span> ` +
        `<a href="/settings.html" class="auth-nav">settings</a>` +
        ` <span class="sep">|</span> ` +
        `<a href="#" class="logout auth-nav">logout</a>`;
      $(".logout").addEventListener("click", async (e) => {
        e.preventDefault();
        await fetch("/api/logout", { method: "POST", credentials: "same-origin" });
        location.reload();
      });
    }

    function renderCompose() {
      if (currentUser) {
        $("#compose-form").style.display = "";
        $("#compose-prompt").style.display = "none";
      } else {
        $("#compose-form").style.display = "none";
        $("#compose-prompt").style.display = "";
      }
    }

    async function loadStory() {
      if (!storyId) {
        $("#story-header").innerHTML = `<p><em>No story specified.</em></p>`;
        return;
      }
      try {
        const res = await fetch(`/api/stories/${storyId}`, { credentials: "same-origin" });
        const data = await res.json();
        if (!res.ok) {
          $("#story-header").innerHTML = `<p><em>${escapeHtml(data.error || "Story not found.")}</em></p>`;
          return;
        }
        currentStory = data.story;
        renderStoryHeader(data.story);
      } catch (e) {
        $("#story-header").innerHTML = `<p><em>Failed to load story.</em></p>`;
      }
    }

    function renderStoryHeader(s) {
      const url = s.url || "#";
      const domain = s.url ? domainOf(s.url) : "";
      const ownerActions = s.editable
        ? ` &middot; <a href="/submit.html?edit=${s.id}">edit</a>` +
          ` &middot; <a href="#" class="delete-story">delete</a>`
        : "";
      $("#story-header").innerHTML = `
        <ol class="story-list" style="margin:0;">
          <li class="story" data-id="${s.id}">
            <span class="rank">&#x270e;</span>
            <span class="upvote ${s.voted ? "voted" : ""}" data-id="${s.id}" title="upvote">&#9650;</span>
            <div class="story-body">
              <span class="story-title">
                <a href="${escapeHtml(url)}">${escapeHtml(s.title)}</a>
                ${domain ? `<span class="domain">(<a href="${escapeHtml(s.url)}">${escapeHtml(domain)}</a>)</span>` : ""}
              </span>
              <div class="meta">
                <span class="points">${s.points}</span> point${s.points === 1 ? "" : "s"} by
                <a href="/user.html?id=${encodeURIComponent(s.user)}" class="user">${escapeHtml(s.user)}</a> ${escapeHtml(s.age)} &middot;
                ${s.comments} comment${s.comments === 1 ? "" : "s"}${ownerActions}
              </div>
              ${s.text ? `<div class="story-text">${renderTextBody(s.text)}</div>` : ""}
            </div>
          </li>
        </ol>
      `;
      const upvote = $("#story-header .upvote");
      upvote.addEventListener("click", async () => {
        if (!currentUser) {
          location.href = "/login.html?next=" + encodeURIComponent(location.pathname + location.search);
          return;
        }
        if (upvote.classList.contains("voted")) return;
        upvote.classList.add("voted");
        const r = await fetch(`/api/stories/${s.id}/vote`, { method: "POST", credentials: "same-origin" });
        if (!r.ok) { upvote.classList.remove("voted"); return; }
        const d = await r.json();
        $("#story-header .points").textContent = d.points;
      });
      const del = $("#story-header .delete-story");
      if (del) del.addEventListener("click", async (e) => {
        e.preventDefault();
        if (!confirm("Delete this story?")) return;
        const r = await fetch(`/api/stories/${s.id}`, { method: "DELETE", credentials: "same-origin" });
        if (!r.ok) { alert("Failed to delete."); return; }
        location.href = "/";
      });
    }

    async function loadComments() {
      if (!storyId) return;
      try {
        const res = await fetch(`/api/stories/${storyId}/comments`, { credentials: "same-origin" });
        const data = await res.json();
        if (!res.ok) {
          $("#comment-list").innerHTML = `<li><em>${escapeHtml(data.error || "Failed to load comments.")}</em></li>`;
          return;
        }
        renderComments(data.comments || []);
      } catch (e) {
        $("#comment-list").innerHTML = `<li><em>Failed to load comments.</em></li>`;
      }
    }

    function renderComments(comments) {
      const ul = $("#comment-list");
      if (comments.length === 0) {
        ul.innerHTML = `<li class="empty"><em>No comments yet.</em></li>`;
        return;
      }
      ul.innerHTML = comments.map(commentHtml).join("");
      attachCommentHandlers(ul);
    }

    function commentHtml(c) {
      const isDeleted = c.text === "[deleted]";
      const repliesHtml = c.replies && c.replies.length
        ? `<ul class="comment-list replies">${c.replies.map(commentHtml).join("")}</ul>`
        : "";
      const actions = isDeleted
        ? ""
        : `<div class="cactions">
             ${currentUser ? `<a href="#" class="reply-btn" data-id="${c.id}">reply</a>` : ""}
             ${c.editable ? ` &middot; <a href="#" class="edit-btn" data-id="${c.id}">edit</a>` : ""}
             ${c.editable ? ` &middot; <a href="#" class="del-btn" data-id="${c.id}">delete</a>` : ""}
           </div>`;
      return `
        <li class="comment" data-id="${c.id}" data-text="${escapeHtml(c.text)}">
          <div class="cmeta">
            <a href="/user.html?id=${encodeURIComponent(c.user)}" class="user">${escapeHtml(c.user)}</a>
            &middot; ${escapeHtml(c.age)}
          </div>
          <div class="cbody">${isDeleted ? "<p><em>[deleted]</em></p>" : renderTextBody(c.text)}</div>
          ${actions}
          ${repliesHtml}
        </li>`;
    }

    function attachCommentHandlers(root) {
      root.querySelectorAll(".reply-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          openReplyForm(btn);
        });
      });
      root.querySelectorAll(".edit-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.preventDefault();
          openEditForm(btn);
        });
      });
      root.querySelectorAll(".del-btn").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          e.preventDefault();
          if (!confirm("Delete this comment?")) return;
          const id = btn.dataset.id;
          const r = await fetch(`/api/comments/${id}`, { method: "DELETE", credentials: "same-origin" });
          if (!r.ok) { alert("Failed to delete."); return; }
          loadComments();
        });
      });
    }

    function openReplyForm(btn) {
      const parentId = btn.dataset.id;
      const cactions = btn.closest(".cactions");
      const original = cactions.innerHTML;
      cactions.innerHTML = `
        <form class="inline-form">
          <textarea required maxlength="5000" placeholder="Reply&hellip;"></textarea>
          <div>
            <button type="submit">reply</button>
            <a href="#" class="cancel-inline">cancel</a>
          </div>
          <p class="error-msg"></p>
        </form>
      `;
      const form = $(".inline-form", cactions);
      $(".cancel-inline", cactions).addEventListener("click", (e) => {
        e.preventDefault();
        cactions.innerHTML = original;
        attachCommentHandlers(cactions.parentElement);
      });
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = $("textarea", form).value.trim();
        const errEl = $(".error-msg", form);
        errEl.textContent = "";
        if (!text) { errEl.textContent = "Write something first."; return; }
        const r = await fetch("/api/comments", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ story_id: storyId, parent_id: parseInt(parentId), text }),
        });
        const d = await r.json();
        if (!r.ok) { errEl.textContent = d.error || "Failed to post."; return; }
        loadComments();
        loadStory();
      });
      $("textarea", form).focus();
    }

    function openEditForm(btn) {
      const id = btn.dataset.id;
      const li = btn.closest(".comment");
      const cbody = $(".cbody", li);
      const cactions = $(".cactions", li);
      const originalText = li.dataset.text;
      cbody.innerHTML = `
        <form class="inline-form">
          <textarea required maxlength="5000"></textarea>
          <div>
            <button type="submit">save</button>
            <a href="#" class="cancel-inline">cancel</a>
          </div>
          <p class="error-msg"></p>
        </form>
      `;
      cactions.innerHTML = "";
      const form = $(".inline-form", cbody);
      $("textarea", form).value = originalText;
      $(".cancel-inline", form).addEventListener("click", (e) => {
        e.preventDefault();
        loadComments();
      });
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = $("textarea", form).value.trim();
        const errEl = $(".error-msg", form);
        errEl.textContent = "";
        if (!text) { errEl.textContent = "Write something first."; return; }
        const r = await fetch(`/api/comments/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ text }),
        });
        const d = await r.json();
        if (!r.ok) { errEl.textContent = d.error || "Failed to save."; return; }
        loadComments();
      });
      $("textarea", form).focus();
    }

    $("#compose-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = $("#compose-text").value.trim();
      const errEl = $("#compose-error");
      errEl.textContent = "";
      if (!text) { errEl.textContent = "Write something first."; return; }
      const res = await fetch("/api/comments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ story_id: storyId, text }),
      });
      const data = await res.json();
      if (!res.ok) { errEl.textContent = data.error || "Failed to post."; return; }
      $("#compose-text").value = "";
      loadComments();
      loadStory();
    });

    init();
  </script>
</body>
</html>
